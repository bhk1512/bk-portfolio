<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont,
      'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    padding: 0 80px;
    box-sizing: border-box;
  }
  .content { max-width: 700px; }
  .name {
    font-size: 52px; font-weight: 700;
    color: #f4f4f5; letter-spacing: -1px;
  }
  .role {
    font-size: 22px; color: #a1a1aa;
    margin-top: 12px;
  }
  .tagline {
    font-size: 18px; color: #71717a;
    margin-top: 20px; line-height: 1.5;
  }
  .pill {
    display: inline-block; margin-top: 28px;
    border: 1px solid #27272a; border-radius: 999px;
    padding: 6px 16px; font-size: 14px; color: #a1a1aa;
  }
  .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #34d399;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="name">Bharat Kaushik</div>
    <div class="role">
      Execution Operator · Systems Builder · IIMA MBA
    </div>
    <div class="tagline">
      I design low-friction systems that turn messy, human processes
      into auditable, decision-ready workflows.
    </div>
    <div class="pill">
      <span class="dot"></span>
      Open to Senior Program · Product Ops · Founder's Office roles
    </div>
  </div>
</body>
</html>
